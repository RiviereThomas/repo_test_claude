<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug - Résultats EET</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #1a1a1a;
            color: #e0e0e0;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: #F7AD00;
            margin-bottom: 2rem;
        }

        .controls {
            background: #242424;
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #F7AD00;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            max-width: 400px;
            padding: 0.75rem;
            background: #2d2d2d;
            border: 2px solid #404040;
            border-radius: 4px;
            color: #e0e0e0;
            font-size: 1rem;
        }

        button {
            background: #F7AD00;
            color: #1a1a1a;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 1rem;
        }

        button:hover {
            background: #F18F01;
        }

        .loading {
            color: #F7AD00;
            font-size: 1.2rem;
            margin: 2rem 0;
            display: none;
        }

        .error {
            background: #ff4444;
            color: white;
            padding: 1rem;
            border-radius: 4px;
            margin: 1rem 0;
            display: none;
        }

        .results {
            background: #242424;
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .results h2 {
            color: #91C57E;
            margin-bottom: 1rem;
        }

        pre {
            background: #1a1a1a;
            padding: 1rem;
            border-radius: 4px;
            overflow-x: auto;
            border: 1px solid #404040;
        }

        .json-key {
            color: #1B998B;
        }

        .json-value {
            color: #F7AD00;
        }

        .json-string {
            color: #91C57E;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: #2d2d2d;
            padding: 1rem;
            border-radius: 4px;
            border-left: 4px solid #F7AD00;
        }

        .stat-label {
            color: #b0b0b0;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            color: #F7AD00;
            font-size: 1.5rem;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Debug - Résultats EET</h1>

        <div class="controls">
            <div class="form-group">
                <label for="fund-input">Fonds (Mnemo_Fund):</label>
                <input type="text" id="fund-input" placeholder="Ex: MANDPAT" value="MANDPAT">
            </div>

            <div class="form-group">
                <label for="version-input">Version EET:</label>
                <input type="text" id="version-input" placeholder="Ex: EET_1_1_3" value="EET_1_1_3">
            </div>

            <div class="form-group">
                <label for="date-input">Date de calcul:</label>
                <input type="text" id="date-input" placeholder="Ex: 31/12/2024" value="31/12/2024">
            </div>

            <button onclick="loadResults()">🚀 Charger les résultats</button>
        </div>

        <div class="loading" id="loading">⏳ Chargement des résultats...</div>
        <div class="error" id="error"></div>

        <div id="results-container"></div>
    </div>

    <script>
        async function loadResults() {
            const fund = document.getElementById('fund-input').value;
            const version = document.getElementById('version-input').value;
            const dateCalcul = document.getElementById('date-input').value;

            if (!fund) {
                showError('Veuillez entrer un fonds');
                return;
            }

            const loading = document.getElementById('loading');
            const errorDiv = document.getElementById('error');
            const resultsContainer = document.getElementById('results-container');

            loading.style.display = 'block';
            errorDiv.style.display = 'none';
            resultsContainer.innerHTML = '';

            try {
                const url = `http://localhost:8000/api/fund-results/${fund}?version=${version}&date_calcul=${encodeURIComponent(dateCalcul)}`;
                console.log('Fetching:', url);

                const response = await fetch(url);

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || `HTTP ${response.status}`);
                }

                const data = await response.json();
                console.log('Data received:', data);

                displayResults(data);
                loading.style.display = 'none';

            } catch (error) {
                console.error('Error:', error);
                showError(`Erreur: ${error.message}`);
                loading.style.display = 'none';
            }
        }

        function displayResults(data) {
            const container = document.getElementById('results-container');

            // Stats
            const resultsCount = Object.keys(data.results || {}).length;
            const nonEmptyResults = Object.values(data.results || {}).filter(v => v !== '' && v !== null).length;

            const statsHTML = `
                <div class="stats">
                    <div class="stat-card">
                        <div class="stat-label">Fonds</div>
                        <div class="stat-value">${data.fund}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Version</div>
                        <div class="stat-value">${data.version}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Date</div>
                        <div class="stat-value">${data.date_calcul}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Total champs</div>
                        <div class="stat-value">${resultsCount}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Résultats non-vides</div>
                        <div class="stat-value">${nonEmptyResults}</div>
                    </div>
                </div>
            `;

            // JSON complet
            const fullJSON = `
                <div class="results">
                    <h2>📦 Réponse complète (JSON)</h2>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                </div>
            `;

            // Tableau des résultats
            let tableHTML = '<div class="results"><h2>📊 Résultats par champ</h2><table style="width: 100%; border-collapse: collapse; margin-top: 1rem;">';
            tableHTML += '<tr style="background: #2d2d2d;"><th style="padding: 0.75rem; text-align: left; border-bottom: 2px solid #F7AD00;">Field Name</th><th style="padding: 0.75rem; text-align: left; border-bottom: 2px solid #F7AD00;">Résultat</th></tr>';

            for (const [fieldName, result] of Object.entries(data.results || {})) {
                const resultDisplay = result === '' || result === null ? '<em style="color: #666;">vide</em>' : result;
                const bgColor = result !== '' && result !== null ? '#1a1a1a' : '#242424';
                tableHTML += `<tr style="background: ${bgColor};"><td style="padding: 0.75rem; border-bottom: 1px solid #404040; color: #1B998B;">${fieldName}</td><td style="padding: 0.75rem; border-bottom: 1px solid #404040; color: #F7AD00;">${resultDisplay}</td></tr>`;
            }

            tableHTML += '</table></div>';

            container.innerHTML = statsHTML + tableHTML + fullJSON;
        }

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        // Auto-load on page load
        window.addEventListener('DOMContentLoaded', () => {
            console.log('Page loaded, ready to debug');
        });
    </script>
</body>
</html>
