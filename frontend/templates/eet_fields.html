<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Champs EET - Visualisation Complète</title>
    <link rel="stylesheet" href="/static/css/table.css">
</head>
<body class="eet-viewer">
    <!-- Header compact -->
    <header class="eet-header">
        <div class="header-content">
            <div class="header-left">
                <a href="/" class="back-link">← Retour</a>
                <h1>Champs EET - Visualisation Complète</h1>
            </div>
            <div class="header-right">
                <span id="row-count" class="row-counter">0 lignes</span>
                <button id="export-btn" class="btn-export">Exporter CSV</button>
            </div>
        </div>
    </header>

    <!-- Barre de filtres compacte -->
    <div class="filters-bar">
        <div class="filters-content">
            <div class="filter-item">
                <label>Version</label>
                <select id="version-filter">
                    <option value="">Toutes</option>
                </select>
            </div>

            <div class="filter-item">
                <label>Fonds (pour résultats)</label>
                <select id="fund-filter">
                    <option value="">Aucun - Métadonnées seulement</option>
                </select>
            </div>

            <div class="filter-item">
                <label>Valeur Fixe</label>
                <select id="fixed-value-filter">
                    <option value="">Tous</option>
                    <option value="1">1 (Oui)</option>
                    <option value="0">0 (Non)</option>
                </select>
            </div>

            <div class="filter-item">
                <label>Filed In</label>
                <select id="filed-in-filter">
                    <option value="">Tous</option>
                </select>
            </div>

            <div class="filter-item search-item">
                <label>Recherche</label>
                <input type="text" id="search-field" placeholder="Nom du champ...">
            </div>

            <div class="filter-actions">
                <button id="apply-filters-btn" class="btn-apply">Filtrer</button>
                <button id="reset-filters-btn" class="btn-reset">Réinitialiser</button>
            </div>
        </div>
    </div>

    <!-- Loading et erreurs -->
    <div id="loading" class="loading-overlay" style="display: none;">
        <div class="loading-spinner"></div>
        <p>Chargement des données...</p>
    </div>

    <div id="error-message" class="error-toast" style="display: none;"></div>

    <!-- Tableau plein écran -->
    <div class="table-container">
        <table id="eet-table" class="data-table">
            <thead>
                <tr>
                    <th data-column="version" class="sortable col-version">
                        <div class="th-content">
                            <span>Version</span>
                            <span class="sort-icon">⇅</span>
                        </div>
                    </th>
                    <th data-column="field_name" class="sortable col-field-name">
                        <div class="th-content">
                            <span>Nom du Champ</span>
                            <span class="sort-icon">⇅</span>
                        </div>
                    </th>
                    <th data-column="is_fixed_value" class="sortable col-fixed">
                        <div class="th-content">
                            <span>Valeur Fixe</span>
                            <span class="sort-icon">⇅</span>
                        </div>
                    </th>
                    <th data-column="value_source" class="sortable col-source">
                        <div class="th-content">
                            <span>Source</span>
                            <span class="sort-icon">⇅</span>
                        </div>
                    </th>
                    <th data-column="is_filed_in" class="sortable col-filed">
                        <div class="th-content">
                            <span>Filed In</span>
                            <span class="sort-icon">⇅</span>
                        </div>
                    </th>
                    <th data-column="requirement_type" class="sortable col-requirement">
                        <div class="th-content">
                            <span>Type Requis</span>
                            <span class="sort-icon">⇅</span>
                        </div>
                    </th>
                    <th data-column="format" class="sortable col-format">
                        <div class="th-content">
                            <span>Format</span>
                            <span class="sort-icon">⇅</span>
                        </div>
                    </th>
                    <th data-column="remarques" class="sortable col-remarks">
                        <div class="th-content">
                            <span>Remarques</span>
                            <span class="sort-icon">⇅</span>
                        </div>
                    </th>
                    <th data-column="result" class="col-result">
                        <div class="th-content">
                            <span>Résultat</span>
                        </div>
                    </th>
                </tr>
            </thead>
            <tbody id="table-body">
                <tr>
                    <td colspan="9" class="no-data">Chargement des données...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Tooltip pour afficher le contenu complet -->
    <div id="cell-tooltip" class="cell-tooltip" style="display: none;"></div>

    <!-- Menu contextuel pour copier -->
    <div id="context-menu" class="context-menu" style="display: none;">
        <div class="context-menu-item" id="copy-cell">
            <span>📋</span> Copier le contenu
        </div>
    </div>

    <script src="/static/js/eet_fields.js"></script>
</body>
</html>
